
groups:
  - name: telemetry-lab-alerts
    interval: 15s
    rules:
      - alert: ServiceDown
        expr: up{job=~"telemetry-api|payment-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for more than 1 minute."

      - alert: HighHTTPErrorRate
        expr: |
          (
            sum by (job) (
              rate(http_requests_total{
                job=~"telemetry-api|payment-service",
                status="5xx"
              }[5m])
            )
            /
            sum by (job) (
              rate(http_requests_total{
                job=~"telemetry-api|payment-service"
              }[5m])
            )
          ) > 0.05
          and on(job)
          sum by (job) (
            rate(http_requests_total{
              job=~"telemetry-api|payment-service"
            }[5m])
          ) > 0.01
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate on {{ $labels.job }}"
          description: "HTTP 5xx error ratio has exceeded 5% for at least 1 minute."
