
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "telemetry-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"

  - job_name: "payment-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"
